name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: [self-hosted, linux, ARM64, interview-production]
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate production environment
        run: |
          test -s /etc/interview-guide/.env.production
          docker compose \
            --env-file /etc/interview-guide/.env.production \
            -f docker-compose.prod.yml \
            config --quiet

      - name: Build images
        run: |
          docker compose \
            --env-file /etc/interview-guide/.env.production \
            -f docker-compose.prod.yml \
            build --pull

      - name: Start services
        run: |
          docker compose \
            --env-file /etc/interview-guide/.env.production \
            -f docker-compose.prod.yml \
            up -d --remove-orphans

      - name: Verify application health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1/actuator/health | grep -q '"status":"UP"'; then
              docker compose \
                --env-file /etc/interview-guide/.env.production \
                -f docker-compose.prod.yml \
                ps
              exit 0
            fi
            sleep 5
          done
          docker compose \
            --env-file /etc/interview-guide/.env.production \
            -f docker-compose.prod.yml \
            logs --tail=200 app caddy
          exit 1

      - name: Remove unused images
        if: success()
        run: docker image prune -f
